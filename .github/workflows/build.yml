name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - release
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Set up Python 3.11 with pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Cache Nuitka build artifacts to speed up builds
      - name: Cache Nuitka artifacts
        uses: actions/cache@v3
        with:
          path: ~/AppData/Local/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-nuitka-

      # Install all dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyside6 nuitka

      # Download and set up Dependency Walker for Nuitka on Windows
      - name: Setup Dependency Walker
        run: |
          $dependsDir = "C:\Users\runneradmin\AppData\Local\Nuitka\Nuitka\Cache\downloads\depends\x86_64"
          if (-Not (Test-Path -Path "$dependsDir\depends.exe")) {
            New-Item -ItemType Directory -Force -Path $dependsDir
            Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile "depends.zip"
            Expand-Archive -Path "depends.zip" -DestinationPath $dependsDir -Force
          }

      # Build single-file executable with Nuitka
      - name: Build executable
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --windows-disable-console --output-dir=dist --output-filename=PicMerge-Windows.exe GUI.py

      # Upload Windows artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicMerge-Windows
          path: dist/PicMerge-Windows.exe
          retention-days: 7
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Set up Python 3.11 with pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Cache Nuitka build artifacts to speed up builds
      - name: Cache Nuitka artifacts
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-nuitka-

      # Install all dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyside6 nuitka

      # Install ccache for Nuitka
      - name: Install ccache
        run: brew install ccache

      # Build macOS app bundle with Nuitka
      - name: Build app bundle
        run: |
          python -m nuitka --standalone --enable-plugin=pyside6 --macos-create-app-bundle --noinclude-data-files=*.pyc,*.pyo --output-dir=dist GUI.py

      # Rename and package app bundle
      - name: Package app bundle
        run: |
          cd dist
          if [ -d "GUI.app" ]; then
            mv GUI.app PicMerge.app
          else
            echo "Error: GUI.app not found"
            exit 1
          fi
          zip -r PicMerge-macOS.zip PicMerge.app

      # Upload macOS artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicMerge-macOS
          path: dist/PicMerge-macOS.zip
          retention-days: 7
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Set up Python 3.11 with pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Cache Nuitka build artifacts to speed up builds
      - name: Cache Nuitka artifacts
        uses: actions/cache@v3
        with:
          path: ~/.cache/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-nuitka-

      # Install system and Python dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxcb-xinerama0 libgl1
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyside6 nuitka

      # Build single-file executable with Nuitka
      - name: Build executable
        run: |
          python -m nuitka --onefile --enable-plugin=pyside6 --output-dir=dist --output-filename=PicMerge-Linux GUI.py

      # Make Linux binary executable
      - name: Make binary executable
        run: chmod +x dist/PicMerge-Linux

      # Upload Linux artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicMerge-Linux
          path: dist/PicMerge-Linux
          retention-days: 7
          if-no-files-found: error

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Download all build artifacts
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 处理从GitHub Release触发的正式版本
      - name: Handle GitHub Release
        if: ${{ github.event_name == 'release' }}
        run: |
          echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${{ github.event.release.name }}" >> $GITHUB_ENV
          # Release body will be used directly in the release step
          echo "PRERELEASE=${{ github.event.release.prerelease }}" >> $GITHUB_ENV

      # 处理手动触发的正式版本
      - name: Handle manual release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'release' }}
        run: |
          VERSION=$(date +'v%Y.%m.%d')
          echo "TAG_NAME=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=PicMerge $VERSION" >> $GITHUB_ENV
          {
            echo 'RELEASE_BODY<<EOF'
            echo "This is an official release of PicMerge."
            echo 'EOF'
          } >> $GITHUB_ENV
          echo "PRERELEASE=false" >> $GITHUB_ENV

      # 处理预览版本
      - name: Handle preview release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'preview' }}
        run: |
          # 删除现有预览版本和标签
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/preview" | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ]; then
            echo "删除预览版本ID: $RELEASE_ID"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi
          # 删除预览标签
          git push origin :refs/tags/preview || true
          
          # 设置发布变量
          echo "TAG_NAME=preview" >> $GITHUB_ENV
          echo "RELEASE_NAME=Preview Release" >> $GITHUB_ENV
          {
            echo 'RELEASE_BODY<<EOF'
            echo "This is a manually triggered pre-release build of the project."
            echo "Contains single-file binaries for Windows and Linux, and a zipped app bundle for macOS."
            echo 'EOF'
          } >> $GITHUB_ENV
          echo "PRERELEASE=true" >> $GITHUB_ENV

      # 创建/更新发布
      - name: Create/Update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ github.event_name == 'release' && github.event.release.body || env.RELEASE_BODY }}
          prerelease: ${{ env.PRERELEASE }}
          draft: false
          files: |
            artifacts/PicMerge-Windows/PicMerge-Windows.exe
            artifacts/PicMerge-macOS/PicMerge-macOS.zip
            artifacts/PicMerge-Linux/PicMerge-Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}