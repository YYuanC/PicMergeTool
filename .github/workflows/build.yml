name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyside6

      - name: 构建 Windows 可执行文件
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: GUI.py
          enable-plugins: pyside6
          include-package: core
          disable-console: true
          onefile: true
          mode: standalone
          output-dir: build

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/GUI.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          brew install ccache
          pip install -r requirements.txt
          pip install pyside6

      - name: 构建 macOS 应用包
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: GUI.py
          enable-plugins: pyside6
          include-package: core
          macos-create-app-bundle: true
          mode: standalone
          output-dir: build

      - name: 打包应用
        run: |
          cd build
          mv GUI.app PicMerge.app
          zip -r PicMerge-macOS.zip PicMerge.app

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/PicMerge-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxcb-xinerama0

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pyside6

      - name: 构建 Linux 可执行文件
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: GUI.py
          enable-plugins: pyside6
          include-package: core
          onefile: true
          mode: standalone
          output-dir: build

      - name: 准备 Linux 发布文件
        run: |
          cd build
          mv GUI.bin PicMerge-Linux
          chmod +x PicMerge-Linux

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/PicMerge-Linux

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建预发布版本
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-build/GUI.exe
            artifacts/macos-build/PicMerge-macOS.zip
            artifacts/linux-build/PicMerge-Linux
          prerelease: true
          generate_release_notes: true
          tag_name: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}