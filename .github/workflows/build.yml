name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyside6 pyinstaller

      - name: 安装 UPX
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "."
          Move-Item -Path "upx-4.2.1-win64\upx.exe" -Destination "upx.exe"

      - name: 构建 Windows 可执行文件
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PicMerge" --add-data "core;core" --upx-dir="./" --exclude-module=PyQt5 GUI.py

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/PicMerge.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyside6 pyinstaller

      - name: 安装 UPX
        run: |
          brew install upx

      - name: 构建 macOS 应用包
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PicMerge" --add-data "core:core" --upx-dir="/usr/local/bin" --exclude-module=PyQt5 GUI.py

      - name: 打包应用
        run: |
          cd dist
          zip -r PicMerge-macOS.zip PicMerge.app

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/PicMerge-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxcb-xinerama0 upx

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pyside6 pyinstaller

      - name: 构建 Linux 可执行文件
        run: |
          pyinstaller --noconfirm --onefile --name "PicMerge-Linux" --add-data "core:core" --upx-dir="/usr/bin" GUI.py

      - name: 准备 Linux 发布文件
        run: |
          chmod +x dist/PicMerge-Linux

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/PicMerge-Linux

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建预发布版本
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-build/PicMerge.exe
            artifacts/macos-build/PicMerge-macOS.zip
            artifacts/linux-build/PicMerge-Linux
          prerelease: true
          generate_release_notes: true
          tag_name: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}